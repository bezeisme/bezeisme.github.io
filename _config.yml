# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 古月枫衿的世外桃源
subtitle: 'Stay curious, stay interesting.'
description: '这里是我的自留地，记录学习、折腾和生活。'
keywords:
author: 你的名字
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 部署后把 url 改成你的真实域名，例如 https://blog.example.com
url: http://localhost:4000
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # 设为 false 可去掉链接末尾的 index.html
  trailing_html: true # 设为 false 可去掉链接末尾的 .html

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # 新文章的文件名
default_layout: post
titlecase: false
external_link:
  enable: true # 外部链接在新标签页打开
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true # 开启后 hexo new post 会同时建同名资源文件夹，方便放图
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## 主题：fluid（秋月同款）或 redefine（点点同款），二者都已装好，改这一行即可切换
theme: fluid

# Deployment
## 部署配置，等确定部署方式后再填
deploy:
  type: ''
